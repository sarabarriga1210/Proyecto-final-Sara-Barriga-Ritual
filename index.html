
<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Protocolo de Desconexión</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050805;
        }

        #marco-protocolo {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: none;
        }

        #control-musica {
            position: fixed;
            z-index: 1000;
            top: 12px;
            right: 12px;
            padding: 9px 11px;
            border: 1px solid #456442;
            background-color: rgba(5, 8, 5, 0.88);
            color: #8fbf88;
            font-family: "Courier New", monospace;
            font-size: 9px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #control-musica:active {
            background-color: #263b27;
        }
    </style>
</head>

<body>

    <iframe
        id="marco-protocolo"
        src="inicio.html"
        title="Protocolo de Desconexión">
    </iframe>

    <button id="control-musica" type="button">
        ♫ MÚSICA: ACTIVADA
    </button>

    <audio
        id="musica-noduz"
        src="assets/ambiente-noduz.mp3"
        loop
        preload="auto">
    </audio>

    <script src="js/sonidos.js"></script>

</body>

</html>
