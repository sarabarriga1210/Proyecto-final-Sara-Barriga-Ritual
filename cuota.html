
<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recap del día</title>

    <link rel="stylesheet" href="css/cuota.css">
</head>

<body>

    <div id="contenedor-pantalla">

        <div id="encabezado">
            <p id="titulo-sistema">REGISTRO DIARIO</p>
            <p id="subtitulo">RECOPILACIÓN DE ACTIVIDAD</p>
        </div>

        <div id="informacion-recap">
            <p id="momento-del-dia">MAÑANA</p>
            <p id="instruccion">REVIVA LOS MOMENTOS DE SU JORNADA</p>
        </div>

        <div id="contenedor-video">
            <video id="video-recap" autoplay muted playsinline></video>
        </div>

        <div id="contenedor-seleccion">

            <p id="instruccion-likes">
                SELECCIONE EL MOMENTO QUE MÁS DISFRUTÓ
            </p>

            <div id="cuadricula-momentos"></div>

            <p id="instruccion-doble-toque">
                DOBLE TOQUE PARA REGISTRAR SU PREFERENCIA
            </p>

        </div>

        <div id="contenedor-likes">
            <p id="contador-likes">
                ♥ 4 LIKES DISPONIBLES
            </p>
        </div>

    </div>

    <script src="js/cuota.js"></script>

</body>

</html>
